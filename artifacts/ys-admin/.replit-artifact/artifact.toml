kind = "web"
previewPath = "/admin/"
title = "YsWatchs Admin"
version = "1.0.0"
id = "artifacts/ys-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 19756

[services.development]
run = "pnpm --filter @workspace/ys-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ys-admin", "run", "build" ]
publicDir = "artifacts/ys-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19756"
BASE_PATH = "/admin/"
