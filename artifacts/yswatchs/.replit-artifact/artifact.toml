kind = "web"
previewPath = "/"
title = "YsWatchs — Boutique"
version = "1.0.0"
id = "artifacts/yswatchs"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21748

[services.development]
run = "pnpm --filter @workspace/yswatchs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yswatchs", "run", "build" ]
publicDir = "artifacts/yswatchs/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21748"
BASE_PATH = "/"
